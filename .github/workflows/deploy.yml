name: Build and deploy

# Push to main → sync the noeta repo's docs/, build the site (including the
# pagefind index and the Playwright-rendered OG image) and deploy the static
# assets to Cloudflare Workers.
#
# The design system is a sibling-checkout file: dependency
# ("@noeta/theme": "file:../noeta-theme"), so the site is checked out into
# site/ with the theme cloned next to it — the same shape as local disk. The
# docs themselves are fetched by scripts/sync-docs.mjs (prebuild), which
# sparse-clones the language repo when no local checkout exists.
on:
  push:
    branches: [main]
  workflow_dispatch:
  # A Noeta release dispatches `release-published` with `{ tag }`; docs syncs its content from that tag.
  repository_dispatch:
    types: [release-published]

concurrency:
  group: deploy
  cancel-in-progress: true

defaults:
  run:
    working-directory: site

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout site
        uses: actions/checkout@v6
        with:
          path: site

      - name: Checkout @noeta/theme
        uses: actions/checkout@v6
        with:
          repository: noeta-lang/noeta-theme
          path: noeta-theme

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: site/package.json

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('site/pnpm-lock.yaml') }}

      - name: Install Chromium
        run: pnpm exec playwright-core install --with-deps chromium

      - name: Resolve latest Noeta release tag
        # Resolve the latest published release tag and use it for BOTH:
        #   - NOETA_VERSION: baked into the built HTML via SITE.version (the header's version pill).
        #   - NOETA_DOCS_REF: the ref sync-docs fetches docs/ from, so /docs matches the released
        #     toolchain instead of unreleased work on main.
        # A release-published dispatch carries the tag in its payload, so prefer that and skip the
        # API calls. For push / manual runs, try /releases/latest (excludes prereleases and drafts),
        # then fall back to the newest non-prerelease v-tag — a tag pushed without a GitHub release
        # still counts. GITHUB_TOKEN lifts the unauthenticated rate limit (60 → 5000 req/h).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAYLOAD_TAG: ${{ github.event.client_payload.tag }}
        run: |
          if [ -n "$PAYLOAD_TAG" ]; then
            TAG="$PAYLOAD_TAG"
            echo "Using tag from dispatch payload: $TAG"
          else
            TAG=$(curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/noeta-lang/noeta/releases/latest \
              | jq -r '.tag_name // empty' || true)
            [ -n "$TAG" ] && echo "Using latest release tag from API: $TAG"
          fi
          if [ -z "$TAG" ]; then
            TAG=$(curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/noeta-lang/noeta/tags?per_page=100" \
              | jq -r '.[].name' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)
            [ -n "$TAG" ] && echo "Using latest non-prerelease tag: $TAG"
          fi
          if [ -n "$TAG" ]; then
            echo "NOETA_VERSION=$TAG" >> "$GITHUB_ENV"
            echo "NOETA_DOCS_REF=$TAG" >> "$GITHUB_ENV"
          else
            # No release yet: SITE.version stays null and sync-docs falls back to main.
            echo "No release tag found; building from main."
          fi

      - name: Install the released noeta binary (std API reference)
        # The std-* pages are generated by `noeta doc --api` (scripts/sync-std.mjs), using the
        # binary of the resolved release so the reference matches the toolchain the version pill
        # names. When the release has no linux asset — or no release exists yet — the site simply
        # builds without the std section, the same graceful degradation as the para pages.
        if: env.NOETA_VERSION != ''
        run: |
          DIST="noeta-${NOETA_VERSION}-x86_64-unknown-linux-gnu"
          URL="https://github.com/noeta-lang/noeta/releases/download/${NOETA_VERSION}/${DIST}.tar.gz"
          if curl -fsSL "$URL" -o /tmp/noeta.tar.gz; then
            tar -xzf /tmp/noeta.tar.gz -C /tmp
            echo "NOETA_BIN=/tmp/${DIST}/noeta" >> "$GITHUB_ENV"
            /tmp/${DIST}/noeta --version
          else
            echo "No linux binary asset for ${NOETA_VERSION}; building without the std reference."
          fi

      - name: Build (docs sync + site + pagefind + OG image)
        run: pnpm run build

      - name: Check internal links and anchors
        # Fails the deploy on any dead internal link or anchor in the built site.
        # Links into a generated section that was skipped this build (no released
        # binary / para repos unreachable) are tolerated as warnings.
        run: pnpm run check:links

      - name: Check the page-contents rail
        # Renders the built site and measures the "On this page" column: a real
        # third column at desktop width, a disclosure below --bp-rail, and a
        # scroll-spy that follows the reader. Reuses the Chromium installed for
        # the OG image above.
        run: pnpm run check:toc

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          command: deploy
